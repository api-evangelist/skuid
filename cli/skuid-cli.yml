description: >-
  The Skuid CLI is a first-party Go command-line application for deploying and
  retrieving Skuid metadata (Pages, themes, and related resources) between Skuid
  environments — the DevOps layer over the low-code platform. The binary itself
  is catalogued in packages/skuid-packages.yml; this artifact enumerates its
  command surface. Authentication is supplied via environment variables (host,
  username, password / client credentials).
docs: https://github.com/skuid/skuid-cli#readme
