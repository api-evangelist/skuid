  go: go install github.com/skuid/skuid-cli@latest
  release: https://github.com/skuid/skuid-cli/releases
auth:
  mechanism: environment variables
  variables:
    - SKUID_HOST
    - SKUID_USERNAME
    - SKUID_PASSWORD
commands:
  metadata:
    - {name: retrieve, description: Retrieve Skuid metadata (Pages) from a Skuid environment to the local filesystem.}
    - {name: deploy, description: Deploy local Skuid metadata (Pages) up to a target Skuid environment.}
  utility:
    - {name: help, description: Get help for any CLI command.}
    - {name: version, description: Print the installed skuid CLI version.}
